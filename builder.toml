description = "Tiny base image (Ubuntu Jammy Jellyfish build image, distroless-like run image) with buildpacks for Java, Java Native Image and Go"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/go:4.22.0"
  version = "4.22.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/java-native-image:14.13.0"
  version = "14.13.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/java:22.6.0"
  version = "22.6.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/procfile:5.15.3"
  version = "5.15.3"

[lifecycle]
  version = "0.21.23"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/java-native-image"
    version = "14.13.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/java"
    version = "22.6.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/go"
    version = "4.22.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/procfile"
    version = "5.15.3"

[stack]
  build-image = "docker.io/paketobuildpacks/build-jammy-tiny:0.2.182"
  id = "io.buildpacks.stacks.jammy.tiny"
  run-image = "index.docker.io/paketobuildpacks/run-jammy-tiny:latest"
